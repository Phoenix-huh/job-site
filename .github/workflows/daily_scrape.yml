name: Daily Scrape

on:
  schedule:
    - cron: "0 0 */2 * *"   # every alternate day at 00:00 UTC
  workflow_dispatch:       # manual trigger from GitHub UI

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install Playwright browsers & system deps
        run: playwright install --with-deps

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run daily job scrape
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python backend/daily_scrape.py --max 20

      - name: Run daily internship scrape
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python backend/daily_scrape_internships.py --max 20
